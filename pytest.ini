[pytest]
# Default command line options:
# -v: verbose output
# --tb=short: shorter traceback format for failures
# -n auto: run tests in parallel using all available CPU cores (via pytest-xdist)
# --html=reports/report.html: generate HTML report
addopts = -v --tb=short -n auto --html=reports/report.html --self-contained-html

# Registering markers to avoid Pytest warnings and allow test filtering
markers =
    ui: UI tests using Playwright
    api: API tests using Requests
    e2e: End-to-End tests crossing multiple layers
    smoke: Critical path tests for quick sanity checks
    regression: Full suite tests

# Configure logging to capture logs in the console and HTML report
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S